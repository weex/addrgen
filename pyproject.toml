[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "addrgen"
version = "0.0.0"
description = "Minimal Bitcoin address generator"
requires-python = ">=3.9"
dependencies = [
    "coincurve==21.0.0",
]

[tool.setuptools]
py-modules = ["addrgen", "ripemd160"]
