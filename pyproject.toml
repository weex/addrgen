[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "addrgen"
version = "0.0.0"
description = "Minimal Bitcoin address generator"
requires-python = ">=3.9"
dependencies = [
    "coincurve==21.0.0; python_version < '3.14'",
    "coincurve @ git+https://github.com/ofek/coincurve.git@2d11b1160c75ae8fd94fe8fe3f226aec176bf9bf ; python_version >= '3.14'",
]

[tool.setuptools]
py-modules = ["addrgen", "ripemd160"]
